name: Feature request
description: Suggest an idea for this project
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome! Describe the problem you're solving, not just the fix you want.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear description of the issue you face.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the dial address it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered